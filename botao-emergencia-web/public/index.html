<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Emergência - Botão de Alerta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 style="color: #999; font-size: 24px; margin: 0 0 20px 0;">BOTÃO DE EMERGENCIA</h1>
        
        <button 
            id="btnEmergencia" 
            aria-label="Acionador de emerg\u00eancia - clique duas vezes para confirmar"
            title="Clique duas vezes para confirmar o acionamento de emerg\u00eancia"
        >
            <br>EMERGENCIA<br>
        </button>

        <p id="status" role="status" aria-live="polite"></p>
        
        <div style="color: #656; font-size: 12px; margin-top: 40px; max-width: 300px;">
            <p>Pressione o botão para acionar emergência</p>
            <p>Uma confirmação será solicitada na segunda ação</p>
        </div>
    <a href=""></a>
    </div>
    
    <script src="client.js"></script>
</body>
</html>
