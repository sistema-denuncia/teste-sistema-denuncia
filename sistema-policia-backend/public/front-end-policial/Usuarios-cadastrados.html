<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários Cadastrados</title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    /* Container principal */
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 800px;
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    h2 {
      color: #1a1a1a;
      font-size: 22px;
    }

    /* Estilo do botão de ação */
    .btn-novo {
      background-color: #4f46e5;
      color: #ffffff;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s;
    }

    .btn-novo:hover {
      background-color: #4338ca;
    }

    /* Container para permitir rolagem em telas pequenas */
    .tabela-wrapper {
      overflow-x: auto;
    }

    /* Estilização da Tabela */
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 14px 16px;
      font-size: 14px;
    }

    th {
      background-color: #f8fafc;
      color: #475569;
      font-weight: 600;
      border-bottom: 2px solid #e2e8f0;
    }

    td {
      color: #334155;
      border-bottom: 1px solid #f1f5f9;
    }

    /* Efeito ao passar o mouse nas linhas */
    tbody tr:hover {
      background-color: #f8fafc;
    }

    /* Badge para simular status ou senha protegida */
    .senha-oculta {
      letter-spacing: 2px;
      color: #94a3b8;
    }

    /* Ações na tabela */
    .btn-excluir {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .btn-excluir:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-container">
      <h2>Usuários Cadastrados</h2>
      <a href="cadastro.html" class="btn-novo">+ Novo Usuário</a>
    </div>

    <div class="tabela-wrapper">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Login</th>
            <th>Senha</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>#01</td>
            <td>admin</td>
            <td><span class="senha-oculta">••••••••</span></td>
            <td><button class="btn-excluir">Excluir</button></td>
          </tr>
          <tr>
            <td>#02</td>
            <td>joao_silva</td>
            <td><span class="senha-oculta">••••••••</span></td>
            <td><button class="btn-excluir">Excluir</button></td>
          </tr>
          <tr>
            <td>#03</td>
            <td>maria_dev</td>
            <td><span class="senha-oculta">••••••••</span></td>
            <td><button class="btn-excluir">Excluir</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
