<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro com Validação</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card-cadastro {
      background: #ffffff;
      padding: 36px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
    }

    .card-cadastro h2 {
      color: #1a1a1a;
      font-size: 24px;
      margin-bottom: 6px;
      text-align: center;
    }

    .card-cadastro p {
      color: #666666;
      font-size: 14px;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #333333;
      font-size: 14px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease-in-out;
    }

    .form-group input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    /* Regras visuais da senha */
    .regras-senha {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 12px;
      color: #64748b;
    }

    .regras-senha ul {
      list-style: none;
      margin-top: 4px;
    }

    .regras-senha li {
      margin-top: 2px;
    }

    /* Mensagem de erro em tempo real */
    .mensagem-erro {
      color: #ef4444;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }

    .btn-cadastrar {
      width: 100%;
      padding: 12px;
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 8px;
    }

    .btn-cadastrar:hover {
      background-color: #4338ca;
    }
  </style>
</head>
<body>

  <div class="card-cadastro">
    <h2>LOGIN DO ADMINISTRADOR</h2>
    <p>Preencha os dados abaixo</p>

    <form id="formCadastro" novalidate>
      <!-- Login -->
      <div class="form-group">
        <label for="login">Login</label>
        <input type="text" id="login" required placeholder="Digite seu usuário">
        <span class="mensagem-erro" id="erroLogin">Por favor, informe o login.</span>
      </div>

      <!-- Senha -->
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required placeholder="Digite sua senha">
        <span class="mensagem-erro" id="erroSenha">A senha não atende aos requisitos.</span>
      </div>

      <!-- Regras da Senha -->
      <div class="regras-senha">
        <strong>A senha deve conter:</strong>
        <ul>
          <li id="regraTamanho">• Mínimo de 8 caracteres</li>
          <li id="regraEspecial">• Pelo menos 1 caractere especial (!@#$%^&*...)</li>
        </ul>
      </div>

      <!-- Confirmar Senha -->
      <div class="form-group">
        <label for="confirmarSenha">Confirmar Senha</label>
        <input type="password" id="confirmarSenha" required placeholder="Repita sua senha">
        <span class="mensagem-erro" id="erroConfirmacao">As senhas não coincidem.</span>
      </div>

      <button type="submit" class="btn-cadastrar">LOGAR</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('formCadastro');
    const loginInput = document.getElementById('login');
    const senhaInput = document.getElementById('senha');
    const confirmarSenhaInput = document.getElementById('confirmarSenha');

    const erroLogin = document.getElementById('erroLogin');
    const erroSenha = document.getElementById('erroSenha');
    const erroConfirmacao = document.getElementById('erroConfirmacao');

    // Regra regex para caracteres especiais
    const regexEspecial = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/;

    form.addEventListener('submit', function(event) {
      event.preventDefault(); // Impede o envio padrão para validar
      
      let valido = true;

      // Validação do Login
      if (loginInput.value.trim() === '') {
        erroLogin.style.display = 'block';
        valido = false;
      } else {
        erroLogin.style.display = 'none';
      }

      // Validação da Senha (8 caracteres e 1 especial)
      const senha = senhaInput.value;
      const possui8Caracteres = senha.length >= 8;
      const possuiEspecial = regexEspecial.test(senha);

      if (!possui8Caracteres || !possuiEspecial) {
        erroSenha.style.display = 'block';
        valido = false;
      } else {
        erroSenha.style.display = 'none';
      }

      // Validação da Confirmação de Senha
      if (confirmarSenhaInput.value !== senha || confirmarSenhaInput.value === '') {
        erroConfirmacao.style.display = 'block';
        valido = false;
      } else {
        erroConfirmacao.style.display = 'none';
      }

      // Se tudo estiver certo
      if (valido) {
        alert('Cadastro realizado com sucesso!');
        form.reset();
      }
    });
  </script>

</body>
</html>
